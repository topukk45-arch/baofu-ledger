name: 构建安卓 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布「最新测试版」要用
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行测试（不通过就不打包）
        run: |
          cd tests
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      # 测试没过：把失败的条目逐条标成注释，在 Actions 页面上直接看得到（不用翻日志）
      - name: 标出失败的测试
        if: failure()
        run: |
          sed -n '/^失败的条目：/,$p' "$RUNNER_TEMP/test-output.txt" | tail -n +2 | head -50 | while IFS= read -r line; do
            echo "::error title=测试失败::${line}"
          done
          grep -E '^\s*✗ ' "$RUNNER_TEMP/test-output.txt" | head -50 | while IFS= read -r line; do
            echo "::error title=失败详情::${line}"
          done

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      - name: 同步网页到原生工程
        run: npx cap sync android

      - name: 还原签名 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/baofu.keystore"

      - name: 编译 APK（固定签名，可覆盖升级）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/baofu.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: baofu-ledger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 每次 main 打包成功,就把 apk 放进固定的「最新测试版」发行页。
      # 下载地址永远不变、不用登录、下到的直接是 apk(Actions 里的是要登录的 zip,而且 90 天过期)。
      # 标成预发行,不会顶掉手动发的正式版。
      - name: 发布到「最新测试版」
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oE 'build [0-9]{4}-[A-Z0-9]+' www/index.html | head -1 | cut -d' ' -f2)
          APK="$RUNNER_TEMP/jiwen-latest.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          WHEN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          NOTES="版本 $VER，打包于 $WHEN（北京时间），对应提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)

          直接下载下面的 jiwen-latest.apk 安装即可，签名不变，可以覆盖升级。
          这里永远是最新一次打包的结果；正式版请看标着「Latest」的那个发行版。"
          # 标签跟着本次提交走
          git push -f origin "$GITHUB_SHA:refs/tags/latest-build"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "最新测试版 $VER" --notes "$NOTES" --prerelease
            gh release upload latest-build "$APK" --clobber
          else
            gh release create latest-build "$APK" --title "最新测试版 $VER" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      # 1016-UI1：界面检查分支 ui-review 打包成功后，放进另一个预发行「界面测试版」（标签 ui-review-build，文件 jiwen-ui.apk）。
      # 只在 ui-review 分支上跑；main 的打包和「最新测试版」不受影响（合并进 main 以后这一步在 main 上也不会触发）。
      # 标成预发行、不标 Latest，不会顶掉正式版。
      - name: 发布到「界面测试版」
        if: github.ref == 'refs/heads/ui-review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oE 'build [0-9]{4}-[A-Z0-9]+' www/index.html | head -1 | cut -d' ' -f2)
          APK="$RUNNER_TEMP/jiwen-ui.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          WHEN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          NOTES="界面检查分支 ui-review 的测试包。版本 $VER，打包于 $WHEN（北京时间），对应提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)

          直接下载下面的 jiwen-ui.apk 安装即可，签名和正式版一样，可以覆盖安装（装回正式版也行）。
          这个包只用来看界面改动；正式版请看标着「Latest」的那个发行版。"
          git push -f origin "$GITHUB_SHA:refs/tags/ui-review-build"
          if gh release view ui-review-build >/dev/null 2>&1; then
            gh release edit ui-review-build --title "界面测试版 $VER" --notes "$NOTES" --prerelease --latest=false
            gh release upload ui-review-build "$APK" --clobber
          else
            gh release create ui-review-build "$APK" --title "界面测试版 $VER" --notes "$NOTES" --prerelease --latest=false --target "$GITHUB_SHA"
          fi
