name: 构建安卓 APK
on:
  # 1020-J：只在推 main 和手动触发时打包；别的分支（claude/ 开头这些）推上去不打，本地跑测试就够了
  # 1021-T1 的体验版分支 10-21 已快进合进 main，那一段「发布到体验版」删掉了
  # 1021-T26 的启动画面体验版分支 10-23 已快进合进 main，那一段「发布到体验版」删掉了
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    # 1017：固定 Ubuntu 24.04。ubuntu-latest 10 月 19 日起换成 Ubuntu 26，打包机自带的安卓 SDK、JDK 可能跟着变；
    # 等新系统稳定了再专门换一次，免得哪天突然打不出包
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # 发布「最新测试版」要用
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 运行测试（不通过就不打包）
        run: |
          cd tests
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      # 测试没过：把失败的条目逐条标成注释，在 Actions 页面上直接看得到（不用翻日志）
      - name: 标出失败的测试
        if: failure()
        run: |
          sed -n '/^失败的条目：/,$p' "$RUNNER_TEMP/test-output.txt" | tail -n +2 | head -50 | while IFS= read -r line; do
            echo "::error title=测试失败::${line}"
          done
          grep -E '^\s*✗ ' "$RUNNER_TEMP/test-output.txt" | head -50 | while IFS= read -r line; do
            echo "::error title=失败详情::${line}"
          done

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      - name: 同步网页到原生工程
        run: npx cap sync android

      - name: 还原签名 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/baofu.keystore"

      - name: 编译 APK（固定签名，可覆盖升级）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/baofu.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # 1017：下载依赖偶尔失败（2c7d9af 那次 Maven Central 临时报「找不到」gson、asm 这些明明有的包），
          # 失败了等 30 秒、强制重新查依赖再试一次；第二次还失败才算失败
          ./gradlew assembleDebug --no-daemon || {
            echo "::warning title=编译重试::第一次编译失败，30 秒后重新下载依赖再试一次"
            sleep 30
            ./gradlew assembleDebug --no-daemon --refresh-dependencies
          }

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v6
        with:
          name: baofu-ledger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 每次 main 打包成功,就把 apk 放进固定的「最新测试版」发行页。
      # 下载地址永远不变、不用登录、下到的直接是 apk(Actions 里的是要登录的 zip,而且 90 天过期)。
      # 标成预发行,不会顶掉手动发的正式版。
      - name: 发布到「最新测试版」
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oE 'build [0-9]{4}-[A-Z0-9]+' www/index.html | head -1 | cut -d' ' -f2)
          APK="$RUNNER_TEMP/jiwen-latest.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          WHEN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          NOTES="版本 $VER，打包于 $WHEN（北京时间），对应提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)

          直接下载下面的 jiwen-latest.apk 安装即可，签名不变，可以覆盖升级。
          这里永远是最新一次打包的结果；正式版请看标着「Latest」的那个发行版。"
          # 标签跟着本次提交走
          git push -f origin "$GITHUB_SHA:refs/tags/latest-build"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "最新测试版 $VER" --notes "$NOTES" --prerelease
            gh release upload latest-build "$APK" --clobber
          else
            gh release create latest-build "$APK" --title "最新测试版 $VER" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      # 1021-β：发正式版。docs/release/publish 里写着要发的标签（比如 v1021-beta），这个发行版还没有就发（标为 Latest），
      #   有了就跳过（以后照常推也不会重复发）。标题读 docs/release/<标签>.title、说明读 docs/release/<标签>.md，
      #   安装包叫 jiwen-<标签去掉 v>.apk，标签打在这次提交上。只在 main 上跑
      - name: 发布正式版（docs/release/publish 里写的、还没发过的）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f docs/release/publish ] || { echo "没有要发的正式版"; exit 0; }
          REL=$(head -1 docs/release/publish | tr -d '[:space:]')
          [ -n "$REL" ] || { echo "没有要发的正式版"; exit 0; }
          if gh release view "$REL" >/dev/null 2>&1; then echo "$REL 已经发过了，跳过"; exit 0; fi
          NOTES_FILE="docs/release/$REL.md"; TITLE_FILE="docs/release/$REL.title"
          test -f "$NOTES_FILE" || { echo "没有说明文件 $NOTES_FILE"; exit 1; }
          TITLE=$(cat "$TITLE_FILE" 2>/dev/null || echo "$REL")
          APK="$RUNNER_TEMP/jiwen-${REL#v}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$REL" "$APK" --title "$TITLE" --notes-file "$NOTES_FILE" --latest --target "$GITHUB_SHA"
