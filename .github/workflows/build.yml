name: 构建安卓 APK
on:
  # 1020-J：只在推 main 和手动触发时打包；别的分支（claude/ 开头这些）推上去不打，本地跑测试就够了
  # 1021-T1 的体验版分支 10-21 已快进合进 main，那一段「发布到体验版」删掉了
  # 1021-T26 的启动画面体验版分支 10-23 已快进合进 main，那一段「发布到体验版」删掉了
  push:
    # 1024-Y 临时：界面修补分支推上去也打包（发到单独的预发布版，见最后两段）。合回 main 之前必须删掉这条分支名
    branches: [main, claude/ecstatic-brown-dc9g03]
  workflow_dispatch:
jobs:
  build:
    # 1017：固定 Ubuntu 24.04。ubuntu-latest 10 月 19 日起换成 Ubuntu 26，打包机自带的安卓 SDK、JDK 可能跟着变；
    # 等新系统稳定了再专门换一次，免得哪天突然打不出包
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # 发布「最新测试版」要用
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 运行测试（不通过就不打包）
        run: |
          cd tests
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      # 测试没过：把失败的条目逐条标成注释，在 Actions 页面上直接看得到（不用翻日志）
      - name: 标出失败的测试
        if: failure()
        run: |
          sed -n '/^失败的条目：/,$p' "$RUNNER_TEMP/test-output.txt" | tail -n +2 | head -50 | while IFS= read -r line; do
            echo "::error title=测试失败::${line}"
          done
          grep -E '^\s*✗ ' "$RUNNER_TEMP/test-output.txt" | head -50 | while IFS= read -r line; do
            echo "::error title=失败详情::${line}"
          done

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      - name: 同步网页到原生工程
        run: npx cap sync android

      - name: 还原签名 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/baofu.keystore"

      - name: 编译 APK（固定签名，可覆盖升级）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/baofu.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # 1017：下载依赖偶尔失败（2c7d9af 那次 Maven Central 临时报「找不到」gson、asm 这些明明有的包），
          # 失败了等 30 秒、强制重新查依赖再试一次；第二次还失败才算失败
          ./gradlew assembleDebug --no-daemon || {
            echo "::warning title=编译重试::第一次编译失败，30 秒后重新下载依赖再试一次"
            sleep 30
            ./gradlew assembleDebug --no-daemon --refresh-dependencies
          }

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v6
        with:
          name: baofu-ledger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 每次 main 打包成功,就把 apk 放进固定的「最新测试版」发行页。
      # 下载地址永远不变、不用登录、下到的直接是 apk(Actions 里的是要登录的 zip,而且 90 天过期)。
      # 标成预发行,不会顶掉手动发的正式版。
      - name: 发布到「最新测试版」
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oE 'build [0-9]{4}-[A-Z0-9]+' www/index.html | head -1 | cut -d' ' -f2)
          APK="$RUNNER_TEMP/jiwen-latest.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          WHEN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          NOTES="版本 $VER，打包于 $WHEN（北京时间），对应提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)

          直接下载下面的 jiwen-latest.apk 安装即可，签名不变，可以覆盖升级。
          这里永远是最新一次打包的结果；正式版请看标着「Latest」的那个发行版。"
          # 标签跟着本次提交走
          git push -f origin "$GITHUB_SHA:refs/tags/latest-build"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "最新测试版 $VER" --notes "$NOTES" --prerelease
            gh release upload latest-build "$APK" --clobber
          else
            gh release create latest-build "$APK" --title "最新测试版 $VER" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      # 1021-β：发正式版。docs/release/publish 里写着要发的标签（比如 v1021-beta），这个发行版还没有就发（标为 Latest），
      #   有了就跳过（以后照常推也不会重复发）。标题读 docs/release/<标签>.title、说明读 docs/release/<标签>.md，
      #   安装包叫 jiwen-<标签去掉 v>.apk，标签打在这次提交上。只在 main 上跑
      - name: 发布正式版（docs/release/publish 里写的、还没发过的）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f docs/release/publish ] || { echo "没有要发的正式版"; exit 0; }
          REL=$(head -1 docs/release/publish | tr -d '[:space:]')
          [ -n "$REL" ] || { echo "没有要发的正式版"; exit 0; }
          if gh release view "$REL" >/dev/null 2>&1; then echo "$REL 已经发过了，跳过"; exit 0; fi
          NOTES_FILE="docs/release/$REL.md"; TITLE_FILE="docs/release/$REL.title"
          test -f "$NOTES_FILE" || { echo "没有说明文件 $NOTES_FILE"; exit 1; }
          TITLE=$(cat "$TITLE_FILE" 2>/dev/null || echo "$REL")
          APK="$RUNNER_TEMP/jiwen-${REL#v}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$REL" "$APK" --title "$TITLE" --notes-file "$NOTES_FILE" --latest --target "$GITHUB_SHA"

      # 1024-Y 临时（合回 main 之前必须删掉这一段）：界面修补分支发「1024-Y 界面版」预发布。
      #   docs/release/branch-publish 第一行写标签（比如 1024-Y），标题读 <标签>.title、说明读 <标签>.md；
      #   没有这个文件就不发。只发到这个单独的标签，绝不碰「最新测试版」latest-build 和正式版
      - name: 发布界面修补版（1024-Y 临时，只在界面修补分支上）
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/ecstatic-brown-dc9g03'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f docs/release/branch-publish ] || { echo "没有要发的界面修补版"; exit 0; }
          REL=$(head -1 docs/release/branch-publish | tr -d '[:space:]')
          [ -n "$REL" ] || { echo "没有要发的界面修补版"; exit 0; }
          case "$REL" in latest-build|v*|trial-build|modules-build) echo "不许发到 $REL"; exit 1;; esac
          NOTES_FILE="docs/release/$REL.md"; TITLE_FILE="docs/release/$REL.title"
          test -f "$NOTES_FILE" || { echo "没有说明文件 $NOTES_FILE"; exit 1; }
          TITLE=$(cat "$TITLE_FILE" 2>/dev/null || echo "$REL")
          APK="$RUNNER_TEMP/jiwen-$REL.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          git push -f origin "$GITHUB_SHA:refs/tags/$REL"
          if gh release view "$REL" >/dev/null 2>&1; then
            gh release edit "$REL" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease --latest=false
            gh release upload "$REL" "$APK" --clobber
          else
            gh release create "$REL" "$APK" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease --latest=false --target "$GITHUB_SHA"
          fi

  # 1024-Y 临时（合回 main 之前必须删掉这一段）：「1024-X 稳妥版」= 把「最新测试版」里 main #306 打的 1024-X 安装包原样复制一份，
  #   发成单独的预发布版 1024-X-safe（标签打在 1547b86）。不重新打包、不改 latest-build；已经发过就跳过
  safe-copy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/ecstatic-brown-dc9g03'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 复制 1024-X 安装包，发「1024-X 稳妥版」
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REL=1024-X-safe; SHA=1547b86736d0354507361d723c1559b4d48286d0
          if gh release view "$REL" >/dev/null 2>&1; then echo "$REL 已经发过了，跳过"; exit 0; fi
          T=$(gh release view latest-build --json name -q .name)
          [ "$T" = "最新测试版 1024-X" ] || { echo "最新测试版现在是「$T」，不是 1024-X，不复制"; exit 1; }
          mkdir -p "$RUNNER_TEMP/safe" && cd "$RUNNER_TEMP/safe"
          gh release download latest-build -p jiwen-latest.apk -R "$GITHUB_REPOSITORY"
          echo "cf792a916d50e6290e72b412445fc8ea9abbaa24f4c0362e89ac838dd6a8466a  jiwen-latest.apk" | sha256sum -c
          mv jiwen-latest.apk jiwen-1024-X-safe.apk
          cd "$GITHUB_WORKSPACE"
          git push -f origin "$SHA:refs/tags/$REL"
          gh release create "$REL" "$RUNNER_TEMP/safe/jiwen-1024-X-safe.apk" --title "1024-X 稳妥版" --prerelease --latest=false --verify-tag --notes "1024-X 原样的安装包（main 打包 #306，提交 1547b86），和「最新测试版 1024-X」是同一个文件（sha256 cf792a91…）。

          不含 10-24 晚上的界面修补；那些在「1024-Y 界面版」里。界面版有问题就装这个，签名不变、安卓版本号一样，直接覆盖安装，手机上的账本不动。"
