<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 1020-D：量「按钮里的字上下居中」（audit.js 第 9 段）时照安卓配字体：西文 Roboto，中文落到思源黑体。
     1020-H：中文改成安卓自带的那一套 Noto Sans CJK SC（1020-D 用的 Noto Sans SC 是另一套，上下留白和手机上不一样，量不出偏上）。
     Chromium 在 Linux 上默认 sans-serif 是 Arial（再落到 Liberation Sans），尺寸和 Roboto 不一样，量出来会差 1px 上下，所以一起指到 Roboto。
     用法：字体放进 ~/.fonts（Roboto-Regular/Bold.ttf：googlefonts/roboto-2 的 src/hinted；NotoSansCJKsc-Regular/Medium/Bold.otf：notofonts/noto-cjk 的 Sans/OTF/SimplifiedChinese），
     这个文件拷成 ~/.config/fontconfig/fonts.conf，再 fc-cache -f。字体文件不放进仓库。 -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Roboto</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Liberation Sans</family><prefer><family>Roboto</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Microsoft Yahei</family><prefer><family>Roboto</family><family>Noto Sans CJK SC</family></prefer></alias>
  <selectfont><rejectfont>
    <glob>/usr/share/fonts/truetype/wqy/*</glob><glob>/usr/share/fonts/opentype/unifont/*</glob>
    <glob>/usr/share/fonts/truetype/liberation*/*</glob><glob>/usr/share/fonts/truetype/dejavu/*</glob>
    <glob>/usr/share/fonts/truetype/freefont/*</glob><glob>/usr/share/fonts/opentype/inter/*</glob>
  </rejectfont></selectfont>
</fontconfig>
